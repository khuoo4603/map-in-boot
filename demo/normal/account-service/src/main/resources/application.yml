server:
  port: ${ACCOUNT_PORT:8082}

spring:
  application:
    name: account-service

mapinboot:
  web:
    auth-mode: ${MAPINBOOT_WEB_AUTHMODE:${MAPINBOOT_WEB_AUTH_MODE:NONE}}
    login:
      password: ${MAPINBOOT_WEB_LOGIN_PASSWORD:${MAPINBOOT_PASSWORD:}}

demo:
  jwt:
    public-key-path: ${JWT_PUBLIC_KEY_PATH:}
    issuer: ${JWT_ISSUER:demo-identity}
    audience: ${JWT_AUDIENCE:demo-services}
  internal:
    service-username: ${DEMO_INTERNAL_SERVICE_USERNAME:main-service}
    service-secret: ${DEMO_INTERNAL_SERVICE_SECRET:mapinboot-normal-demo-internal-service-secret}


