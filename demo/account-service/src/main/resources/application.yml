server:
  port: ${ACCOUNT_PORT:8082}

spring:
  application:
    name: account-service

demo:
  jwt:
    public-key-path: ${JWT_PUBLIC_KEY_PATH:}
    issuer: ${JWT_ISSUER:demo-identity}
    audience: ${JWT_AUDIENCE:demo-services}
  internal:
    service-username: ${DEMO_INTERNAL_SERVICE_USERNAME:}
    service-secret: ${DEMO_INTERNAL_SERVICE_SECRET:}


