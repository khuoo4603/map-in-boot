server:
  port: ${IDENTITY_PORT:8081}

spring:
  application:
    name: identity-service

mapinboot:
  web:
    auth-mode: ${MAPINBOOT_WEB_AUTHMODE:${MAPINBOOT_WEB_AUTH_MODE:NONE}}
    login:
      password: ${MAPINBOOT_WEB_LOGIN_PASSWORD:${MAPINBOOT_PASSWORD:}}

demo:
  jwt:
    private-key-path: ${JWT_PRIVATE_KEY_PATH:}
    public-key-path: ${JWT_PUBLIC_KEY_PATH:}
    issuer: ${JWT_ISSUER:demo-identity}
    audience: ${JWT_AUDIENCE:demo-services}
    access-token-expiration-seconds: 3600
  identity:
    demo-otp: "123456"
