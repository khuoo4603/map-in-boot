dependencies {
    api project(':map-in-boot-core')
    compileOnly 'org.springframework.boot:spring-boot-autoconfigure:4.0.9'
    compileOnly 'org.springframework.security:spring-security-config:7.0.8'
    compileOnly 'org.springframework.security:spring-security-web:7.0.8'
    compileOnly 'jakarta.annotation:jakarta.annotation-api:3.0.0'
    compileOnly 'jakarta.servlet:jakarta.servlet-api:6.1.0'

    testImplementation 'org.springframework.boot:spring-boot-autoconfigure:4.0.9'
    testImplementation 'org.springframework.boot:spring-boot-test:4.0.9'
    testImplementation 'org.assertj:assertj-core:3.27.7'
    testImplementation project(':map-in-boot-starter')
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc:4.0.9'
    testImplementation 'org.springframework.security:spring-security-config:7.0.8'
    testImplementation 'org.springframework.security:spring-security-web:7.0.8'
    testImplementation 'jakarta.annotation:jakarta.annotation-api:3.0.0'
    testImplementation 'jakarta.servlet:jakarta.servlet-api:6.1.0'
}
