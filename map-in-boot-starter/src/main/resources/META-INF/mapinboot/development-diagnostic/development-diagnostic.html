<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Map in Boot Development Diagnostics</title>
  <link rel="stylesheet" href="/mapinboot/test/assets/development-diagnostic.css">
</head>
<body>
<div class="diagnostic-app">
  <aside class="sidebar" aria-label="진단 메뉴">
    <a class="brand" href="/mapinboot/test">Map in Boot</a>
    <nav class="navigation">
      <button class="nav-item active" type="button" data-view="dashboard">대시보드</button>
      <button class="nav-item" type="button" data-view="endpoints">엔드포인트</button>
      <button class="nav-item" type="button" data-view="chains">보안 체인</button>
      <button class="nav-item" type="button" data-view="policies">URL 접근 정책</button>
      <button class="nav-item" type="button" data-view="filters">필터</button>
      <button class="nav-item" type="button" data-view="findings">진단 결과</button>
      <button class="nav-item" type="button" data-view="evidence">분석 근거</button>
      <button class="nav-item" type="button" data-view="diagnostics">실행 진단</button>
    </nav>
  </aside>
  <div class="workspace">
    <header class="topbar">
      <div><span id="service-name">서비스 정보 확인 중</span><span id="service-meta">개발 진단 화면</span></div>
      <div class="topbar-actions"><span id="request-state" class="request-state" aria-live="polite">조회 대기</span><button id="snapshot-download-button" type="button" disabled>Snapshot 다운로드</button><button id="refresh-button" type="button">새로고침</button></div>
    </header>
    <main id="view-content" class="content" tabindex="-1"></main>
  </div>
</div>
<script src="/mapinboot/test/assets/development-diagnostic.js"></script>
</body>
</html>
