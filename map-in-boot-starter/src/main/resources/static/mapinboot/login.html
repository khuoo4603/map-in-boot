<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Map in Boot 로그인</title>
  <link rel="stylesheet" href="/mapinboot/login.css">
  <script src="/mapinboot/login.js" defer></script>
</head>
<body>
  <main class="login-shell">
    <form class="login-form" id="login-form" action="/mapinboot/api/auth/login" method="post" novalidate>
      <h1>Map in Boot</h1>
      <label for="password">비밀번호</label>
      <div class="password-field">
        <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
        <button id="password-toggle" type="button" aria-label="비밀번호 표시" aria-pressed="false">
          <svg class="password-toggle-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path class="eye-open" d="M2.5 12s3.4-6 9.5-6 9.5 6 9.5 6-3.4 6-9.5 6-9.5-6-9.5-6Z"></path>
            <circle class="eye-pupil" cx="12" cy="12" r="2.8"></circle>
            <path class="eye-slash" d="M3 3l18 18M10.6 6.2c.5-.1.9-.2 1.4-.2 6.1 0 9.5 6 9.5 6a14.8 14.8 0 0 1-3.1 3.7M7.1 7.1C4.1 8.7 2.5 12 2.5 12s3.4 6 9.5 6c1.2 0 2.3-.3 3.3-.7"></path>
          </svg>
        </button>
      </div>
      <button class="submit-button" id="submit-button" type="submit">접속</button>
      <p class="login-message" id="login-message" role="status" aria-live="polite"></p>
    </form>
  </main>
</body>
</html>
