<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Map in Boot</title>
  <link rel="stylesheet" href="/mapinboot/app.css">
</head>
<body data-ui-shell>
  <div class="app-shell">
    <header class="app-header">
      <div class="header-group header-left" aria-label="서비스 정보">
        <span class="product-name">Map in Boot</span>
        <span class="service-name" id="service-name">main-service</span>
        <span class="snapshot-time" id="snapshot-time">조회 전</span>
      </div>
      <div class="header-group header-right" aria-label="화면 도구">
        <button class="header-action" id="refresh-button" type="button">결과 다시 불러오기</button>
        <button class="header-action icon-action" id="help-button" type="button" aria-label="도움말" aria-expanded="false"><span aria-hidden="true">?</span></button>
        <button class="header-action" id="settings-button" type="button" aria-expanded="false">설정</button>
      </div>
    </header>

    <div class="app-body">
      <aside class="sidebar" id="sidebar" data-sidebar-state="collapsed">
        <div class="sidebar-logo">
          <img src="/mapinboot/assets/mapinboot_logo_transparent.png" alt="Map in Boot 로고">
        </div>
        <button class="sidebar-toggle" id="sidebar-toggle" type="button" aria-label="메뉴 펼치기" aria-expanded="false">
          <span class="toggle-mark" aria-hidden="true">›</span>
          <span class="sidebar-label">메뉴 펼치기</span>
        </button>
        <nav class="sidebar-nav" aria-label="주요 화면">
          <button class="nav-item is-active" type="button" data-view="all-flow" aria-current="page" title="전체 MAP">
            <span class="nav-mark nav-mark-map" aria-hidden="true"></span><span class="sidebar-label">전체 MAP</span>
          </button>
          <button class="nav-item" type="button" data-view="feature-flow" title="기능별 상세">
            <span class="nav-mark nav-mark-detail" aria-hidden="true"></span><span class="sidebar-label">기능별 상세</span>
          </button>
          <button class="nav-item" type="button" data-view="security-flow" title="보안 MAP">
            <span class="nav-mark nav-mark-security" aria-hidden="true"></span><span class="sidebar-label">보안 MAP</span>
          </button>
          <button class="nav-item" type="button" data-view="security-detail" title="상세 취약점">
            <span class="nav-mark nav-mark-finding" aria-hidden="true"></span><span class="sidebar-label">상세 취약점</span>
          </button>
        </nav>
      </aside>

      <main class="main-content">
        <section class="graph-canvas" aria-labelledby="view-title">
          <div class="view-heading">
            <h1 id="view-title">전체 Flow Map</h1>
            <span class="view-state" id="view-state">Snapshot 조회 전</span>
          </div>
          <div class="graph-tools" aria-label="Graph 탐색 도구">
            <label class="graph-search">Endpoint 검색
              <input id="endpoint-search" type="search" autocomplete="off" placeholder="Method·Path·Handler">
            </label>
            <label>검색 결과
              <select id="endpoint-results" aria-label="Endpoint 검색 결과" disabled>
                <option value="">검색어를 입력하세요</option>
              </select>
            </label>
            <label>NodeType
              <select id="node-filter">
                <option value="">모든 NodeType</option>
                <option value="APPLICATION">APPLICATION</option>
                <option value="SERVLET">SERVLET</option>
                <option value="ENDPOINT">ENDPOINT</option>
                <option value="HANDLER">HANDLER</option>
                <option value="SECURITY_CHAIN">SECURITY_CHAIN</option>
                <option value="FILTER">FILTER</option>
                <option value="AUTHENTICATION">AUTHENTICATION</option>
                <option value="AUTHORIZATION">AUTHORIZATION</option>
                <option value="SECURITY_DATA">SECURITY_DATA</option>
                <option value="BUSINESS_SECURITY_STATE">BUSINESS_SECURITY_STATE</option>
              </select>
            </label>
            <label>EdgeType
              <select id="edge-filter">
                <option value="">모든 EdgeType</option>
                <option value="FLOWS_TO">FLOWS_TO</option>
                <option value="MATCHED_BY">MATCHED_BY</option>
                <option value="FILTERED_BY">FILTERED_BY</option>
                <option value="SECURED_BY">SECURED_BY</option>
                <option value="READS_SECURITY_DATA">READS_SECURITY_DATA</option>
                <option value="WRITES_SECURITY_DATA">WRITES_SECURITY_DATA</option>
                <option value="CONVERTS_TO_AUTHORITY">CONVERTS_TO_AUTHORITY</option>
                <option value="USES_FOR_AUTHORIZATION">USES_FOR_AUTHORIZATION</option>
                <option value="SECURITY_STATE">SECURITY_STATE</option>
              </select>
            </label>
            <button class="graph-tool-button" id="search-reset" type="button">검색 초기화</button>
            <span class="graph-filter-status" id="graph-filter-status" role="status" aria-live="polite">Graph 없음</span>
            <div class="graph-navigation-tools" aria-label="화면 이동 도구">
              <button class="graph-tool-button" id="zoom-out" type="button" aria-label="Graph 축소">−</button>
              <button class="graph-tool-button" id="zoom-in" type="button" aria-label="Graph 확대">+</button>
              <button class="graph-tool-button" id="fit-graph" type="button">화면 맞춤</button>
              <button class="graph-tool-button" id="reset-view" type="button">보기 초기화</button>
            </div>
          </div>
          <div class="graph-surface" id="graph-canvas" data-graph-state="empty">
            <div class="canvas-empty" id="graph-empty">
            <p id="graph-state-message">Snapshot 조회 후 Graph를 표시합니다.</p>
            </div>
            <svg id="graph-svg" class="graph-svg" viewBox="0 0 640 360" role="img" aria-label="Snapshot Graph" hidden>
              <defs>
                <pattern id="graph-dot-pattern" width="24" height="24" patternUnits="userSpaceOnUse">
                  <circle cx="2" cy="2" r="1" fill="#26382b"></circle>
                </pattern>
                <marker id="graph-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
                  <path d="M 0 0 L 10 5 L 0 10 z" fill="#86efac"></path>
                </marker>
              </defs>
              <rect class="graph-background" width="100%" height="100%" fill="url(#graph-dot-pattern)"></rect>
              <g id="graph-viewport">
                <g id="graph-areas" class="graph-areas" aria-hidden="true"></g>
                <g id="graph-edges"></g>
                <g id="graph-nodes"></g>
              </g>
            </svg>
            <div class="graph-minimap" id="graph-minimap" hidden>
              <svg id="graph-minimap-svg" viewBox="0 0 640 360" role="img" aria-label="Graph 미니맵">
                <rect class="graph-minimap-background" x="0" y="0" width="640" height="360"></rect>
                <g id="graph-minimap-nodes"></g>
                <rect id="graph-minimap-viewport" class="graph-minimap-viewport" x="0" y="0" width="640" height="360"></rect>
              </svg>
            </div>
            <div class="graph-popover" id="graph-popover" role="status" aria-live="polite" hidden></div>
          </div>
        </section>
      </main>

      <aside class="inspector" id="inspector" aria-hidden="true" hidden></aside>
    </div>
  </div>
  <div class="shell-notice" id="shell-notice" role="status" aria-live="polite" hidden></div>
  <script src="/mapinboot/vendor/elk-api.js" defer></script>
  <script src="/mapinboot/graph-renderer.js" defer></script>
  <script src="/mapinboot/layout-client.js" defer></script>
  <script src="/mapinboot/graph-navigation.js" defer></script>
  <script src="/mapinboot/graph-inspector.js" defer></script>
  <script src="/mapinboot/app.js" defer></script>
</body>
</html>
